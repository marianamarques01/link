            - heading "Como trabalhamos" [level=2] [ref=e37]
            - paragraph [ref=e38]: Aqui, entendemos que uma assessoria de imprensa eficiente nasce do equilíbrio entre estratégia, relacionamento e credibilidade. Atuamos como ponte entre marcas e jornalistas, com profundo entendimento das dinâmicas do jornalismo, da agenda pública e das oportunidades de exposição espontânea.
            - paragraph [ref=e39]: Nosso trabalho envolve a construção de narrativas relevantes, relacionamento ativo com veículos e formadores de opinião, gestão de oportunidades e monitoramento contínuo de imagem, transformando histórias em presença qualificada na mídia e em valor reputacional para o negócio.
